name: Auto Update Project

on:
  push:
    branches:
      - master
      - main

  schedule:
    - cron: "0 */6 * * *"  # كل 6 ساعات

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Git
        run: |
          git config user.name "AI Bot"
          git config user.email "bot@github.com"

      - name: Make changes
        run: |
          echo "Last update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> auto-log.txt

      - name: Commit changes
        run: |
          git add auto-log.txt
          git diff --cached --quiet || git commit -m "auto: update project"

      - name: Push changes
        run: git push origin HEAD:${GITHUB_REF_NAME}
