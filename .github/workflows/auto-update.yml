name: Project Health Check

on:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate repository
        run: |
          git diff --check
          test -f package.json
          test -f src/data/jurisdictions-data.ts
          echo "Repository validation passed."
