name: Temporary text fix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  replace-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace directory intro text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/JudicialInstitutionsInfo.tsx')
          s = p.read_text(encoding='utf-8')
          old = '🤝 هذا العمل مبادرة مستقلة واجتهاد جماعي من زملاء محامين، ولا يتبع وزارة العدل أو أي جهة قضائية أو نقابية أو مهنية. هدفنا الأساسي هو إبقاء <b>أرقام مندوبيات المحامين À JOUR</b>. إذا كان لديك رقم غير موجود أو وجدت رقمًا خاطئًا، ساهم معنا ليستفيد الجميع.'
          new = '🤝 هذا العمل مبادرة جماعية من الزملاء المحامين، هدفها تسهيل الوصول إلى أرقام مندوبيات المحامين ومعلومات الهيئات القضائية عبر مختلف أنحاء الوطن. 🎯 هدفنا الأساسي هو الحفاظ على <b>أرقام مندوبيات المحامين مُحدّثة ودقيقة</b>، حتى يستفيد منها جميع الزملاء عند الحاجة. 📱 إذا كان لديك رقم غير موجود، أو لاحظت رقمًا خاطئًا أو تغيّر رقمًا سابقًا، يمكنك التواصل معنا للمساهمة في تحديث الدليل وإثرائه. <b>ساهم بمعلومة صحيحة، ليستفيد منها الجميع. 🤝</b>'
          if old not in s:
              raise SystemExit('Target text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/JudicialInstitutionsInfo.tsx
          git rm .github/workflows/temporary-text-fix.yml
          git commit -m "Update judicial directory intro text"
          git push